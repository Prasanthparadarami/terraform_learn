name: Terraform CI/CD

on:
  push:
    branches:
      - qa
      - master
      - dev
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'terraform/**'
  workflow_dispatch:

env:
  TF_VERSION: 1.5.0
  AWS_REGION: us-east-1

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tf-dir:
          - 'terraform/backup/01-terraform-basics'
          - 'terraform/backup/02-more-terraform-basics'
          - 'terraform/backup/03-lists-and-sets'
          - 'terraform/backup/04-maps'
          - 'terraform/backup/05-ec2-instances'
          - 'terraform/backup/06-ec2-with-elb'
          - 'terraform/backup/07-backend-state'
          - 'terraform/backup/08-modules'
          - 'terraform/backup/09-multiple-ec2-instances'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ matrix.tf-dir }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ matrix.tf-dir }}
        run: terraform init -backend=false
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ${{ matrix.tf-dir }}
        run: terraform validate
        continue-on-error: true

  terraform-lint:
    name: TFLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3
        with:
          tflint_version: latest

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact --recursive terraform/

  terraform-security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Terraform Plan
        working-directory: terraform/
        run: terraform init && terraform plan -out=tfplan
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Terraform validation and plan completed. See workflow run for details.'
            })

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [terraform-validate, terraform-lint, terraform-security]
    if: success()
    steps:
      - name: Success Message
        run: echo "✅ All Terraform checks passed successfully!"
